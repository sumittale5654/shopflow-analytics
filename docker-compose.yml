version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSHMnToK_PNMUAzp8E7-bMZPJFpA="
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "shopflow_secret_key"
    SHOPFLOW_PG_HOST: postgres-source
    SHOPFLOW_PG_PORT: 5432
    SHOPFLOW_PG_DB: shopflow_db
    SHOPFLOW_PG_USER: shopflow
    SHOPFLOW_PG_PASSWORD: shopflow123
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./orchestration/logs:/opt/airflow/logs
    - ./ingestion:/opt/airflow/ingestion
    - ./processing:/opt/airflow/processing
    - ./storage:/opt/airflow/storage
    - ./data_quality:/opt/airflow/data_quality
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # ── Source database (e-commerce OLTP) ──────────────────────────────────────
  postgres-source:
    image: postgres:15
    container_name: shopflow_source_db
    environment:
      POSTGRES_DB: shopflow_db
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow123
    ports:
      - "5433:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./docker/init_source.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow metadata database ───────────────────────────────────────────────
  postgres-airflow:
    image: postgres:15
    container_name: shopflow_airflow_db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5434:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow init ────────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: shopflow_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@shopflow.com \
          --password admin123
    restart: on-failure

  # ── Airflow webserver ───────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: shopflow_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Airflow scheduler ───────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: shopflow_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── PySpark worker ──────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark
    container_name: shopflow_spark
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "8090:8080"
      - "7077:7077"
    volumes:
      - ./processing:/opt/processing
      - ./data:/opt/data

  # ── ETL Python worker ───────────────────────────────────────────────────────
  etl-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: shopflow_etl
    environment:
      SHOPFLOW_PG_HOST: postgres-source
      SHOPFLOW_PG_PORT: 5432
      SHOPFLOW_PG_DB: shopflow_db
      SHOPFLOW_PG_USER: shopflow
      SHOPFLOW_PG_PASSWORD: shopflow123
    volumes:
      - ./ingestion:/app/ingestion
      - ./processing:/app/processing
      - ./storage:/app/storage
      - ./data_quality:/app/data_quality
      - ./scripts:/app/scripts
      - ./data:/app/data
    depends_on:
      postgres-source:
        condition: service_healthy
    command: tail -f /dev/null

volumes:
  postgres_source_data:
  postgres_airflow_data:
